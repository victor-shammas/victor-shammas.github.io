[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

# RSS feeds: the blog (/blog/index.xml, layouts/blog/list.rss.xml) and the
# reading log (/reading/index.xml, set in content/reading.md).
[[cascade]]
  title = "Blog"
  description = "Essays and book reviews on sociology, politics, and culture."
  outputs = ["HTML", "RSS"]
  [cascade._target]
    kind = "section"
    path = "/blog"

[pagination]
  pagerSize = 10
