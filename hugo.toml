baseURL = "https://victorshammas.com/"
languageCode = "en-us"
title = "Dr. Victor Shammas"

# Use relative URLs so the site works at any domain
# (GitHub Pages temporary URL, custom domain, localhost, etc.)
relativeURLs = true
canonicalifyURLs = false

[params]
  description = "Sociologist — University of Bergen, Norway"
  # The home page's search/preview description (other pages use their own).
  homeDescription = "Victor Lund Shammas, Associate Professor of Sociology at the University of Bergen, Norway: penology, political economy, and critical theory."
  author = "Victor Lund Shammas"
  email = "contact@victorshammas.com"
  # Cloudflare Web Analytics beacon token (public — appears in page HTML).
  # Loaded only in production builds; leave empty to disable.
  cloudflareAnalyticsToken = "3fc9d9e70dba473490a7340792fdd54a"

[params.social]
  uibProfile = "https://www4.uib.no/en/find-employees/victor-lund.shammas"
  googleScholar = "https://scholar.google.no/citations?user=FQgxhqkAAAAJ"
  academia = "https://uio.academia.edu/VictorLundShammas"
  researchGate = "https://www.researchgate.net/profile/Victor_Shammas"
  linkedIn = "https://www.linkedin.com/in/victor-shammas/"
  hermeneuticAiLab = "https://lab.hrmn.ai"
  webOfScience = "https://www.webofscience.com/wos/author/record/ABG-2748-2021"
  substack = "https://www.theorybrief.com"

