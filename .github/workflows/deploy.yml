name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.139.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install PDF text + OCR tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-nor

      - name: Install Node dependencies
        run: npm install

      - name: Compute PDF cache key (rolls over weekly, or when a PDF changes)
        id: pdfkey
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "set=$(find static/pdfs -name '*.pdf' -printf '%f %s\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache extracted PDF text
        uses: actions/cache@v6
        with:
          path: .cache
          # No restore-keys: a new ISO week (or a changed PDF set) is a cache
          # miss, which forces the heavy pdftotext/OCR pass to re-run. Within a
          # week with an unchanged PDF set, the cache hits and text is reused.
          key: pdf-text-${{ steps.pdfkey.outputs.week }}-${{ steps.pdfkey.outputs.set }}

      - name: Build
        run: hugo --minify

      - name: Build search index (HTML always; PDF text reused from cache)
        run: npm run build:search

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
