name: Publish queued reading items and fill in titles

# After any change to data/reading.yaml or data/reading-queue.yaml:
#
# 1. Move queue items ticked "Publish" in the admin to the reading log
#    (scripts/publish-reading-queue.mjs).
# 2. Fetch each blank-titled link's page title, in both files (entries can
#    be logged in the admin with just a URL).
#
# and commit the result back. That commit is made with GITHUB_TOKEN, so it
# doesn't trigger a deploy by itself; the last step starts one when the log
# changed, so published items and titles go live (until then the page shows
# the link's domain in place of the title).
#
# Titles typed or edited in the admin always win: only blank titles are
# filled, and the bot never merges. It reads the latest main, fills, and
# pushes only as a fast-forward; if main moved in the meantime (e.g. a
# title was just edited), it starts over from the new file.

on:
  push:
    branches: [main]
    # Also re-run when the resolver changes, to retry links it missed before.
    paths: [data/reading.yaml, data/reading-queue.yaml, scripts/fill-reading-titles.mjs, scripts/publish-reading-queue.mjs]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with import-bluesky-reading so the two never write at the same time.
concurrency:
  group: reading-log
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Publish approved items, fill blank titles, commit, and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            npm run --silent publish:reading
            npm run --silent fill:reading
            if git diff --quiet -- data/reading.yaml data/reading-queue.yaml; then
              echo "Nothing to publish and no titles to add."
              exit 0
            fi
            # The queue isn't on the site, so only a change to the log needs a deploy.
            if git diff --quiet -- data/reading.yaml; then deploy=; else deploy=1; fi
            git commit -qam "Reading log: publish approved queue items, fill in titles"
            if git push origin HEAD:main; then
              if [ -n "$deploy" ]; then gh workflow run deploy.yml --ref main; fi
              exit 0
            fi
            echo "main changed meanwhile; starting over from the latest files."
          done
          echo "::warning::Gave up after 3 attempts; the next save to the reading log or queue retries."
