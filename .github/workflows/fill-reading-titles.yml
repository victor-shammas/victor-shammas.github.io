name: Fill in reading-log titles

# Reading entries can be logged in the admin panel with just a URL. After
# any change to data/reading.yaml, fetch each blank-titled link's page title
# and commit it back. That commit is made with GITHUB_TOKEN, so it doesn't
# trigger a deploy by itself; the last step starts one so the titles go live
# (until then the page shows the link's domain in place of the title).
#
# Titles typed or edited in the admin always win: only blank titles are
# filled, and the bot never merges. It reads the latest main, fills, and
# pushes only as a fast-forward; if main moved in the meantime (e.g. a
# title was just edited), it starts over from the new file.

on:
  push:
    branches: [main]
    # Also re-run when the resolver changes, to retry links it missed before.
    paths: [data/reading.yaml, scripts/fill-reading-titles.mjs]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with import-bluesky-reading so the two never write at the same time.
concurrency:
  group: reading-log
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Fill blank titles, commit, and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            npm run --silent fill:reading
            if git diff --quiet -- data/reading.yaml; then
              echo "No titles to add."
              exit 0
            fi
            git commit -qam "Fill in reading-log titles"
            if git push origin HEAD:main; then
              gh workflow run deploy.yml --ref main
              exit 0
            fi
            echo "main changed while fetching titles; starting over from the latest file."
          done
          echo "::warning::Gave up after 3 attempts; the next save to data/reading.yaml retries."
