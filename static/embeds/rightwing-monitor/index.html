<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Right-Wing Monitor</title>
        <meta
            name="description"
            content="A media monitoring tool tracking right-wing and far-right political actors across Europe and the United States for research purposes."
        />
        <meta property="og:title" content="Right-Wing Monitor" />
        <meta
            property="og:description"
            content="Research instrument. Analytical observation of transatlantic right-wing and far-right actors."
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Right-Wing Monitor" />
        <meta
            name="twitter:description"
            content="Research instrument. Analytical observation."
        />
        <style>
            :root {
                --bg: #f5f5f4;
                --ink: #1c1917;
                --mute: #78716c;
                --line: #e7e5e4;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font:
                    15px/1.45 -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }
            .wrap {
                max-width: 1200px;
                margin: 0 auto;
                padding: 16px;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                flex-wrap: wrap;
                gap: 12px;
                margin-bottom: 16px;
            }
            h1 {
                margin: 0;
                font-size: 22px;
            }
            .sub {
                color: var(--mute);
                font-size: 13px;
                margin-top: 2px;
            }
            .framing {
                background: #fff;
                border: 1px solid var(--line);
                border-left: 3px solid #1c1917;
                border-radius: 6px;
                padding: 14px 16px;
                margin-bottom: 20px;
                font-size: 13.5px;
                line-height: 1.55;
                color: #292524;
            }
            .framing p {
                margin: 0 0 8px 0;
            }
            .framing p:last-child {
                margin-bottom: 0;
            }
            .framing .byline {
                color: var(--mute);
                font-size: 12.5px;
                margin-top: 10px;
            }
            .framing a {
                color: #1c1917;
            }
            button {
                font: inherit;
                cursor: pointer;
                border-radius: 8px;
                border: 1px solid var(--line);
                background: #fff;
                padding: 8px 12px;
            }
            button.primary {
                background: #1c1917;
                color: #fff;
                border-color: #1c1917;
            }
            button:disabled {
                opacity: 0.5;
                cursor: wait;
            }
            .head-btns {
                display: flex;
                gap: 6px;
                flex-shrink: 0;
            }
            .tbtn {
                font: inherit;
                cursor: pointer;
                border-radius: 8px;
                border: 1px solid var(--line);
                background: #fff;
                padding: 6px 9px;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.3px;
                color: #57534e;
            }
            .tbtn.active {
                background: #1c1917;
                color: #fff;
                border-color: #1c1917;
            }
            .tbtn:disabled {
                opacity: 0.5;
                cursor: wait;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 14px;
            }
            @media (min-width: 720px) {
                .grid {
                    grid-template-columns: repeat(3, 1fr);
                }
            }
            .card {
                background: #fff;
                border: 1px solid var(--line);
                border-top: 2px solid var(--line);
                border-radius: 6px;
                padding: 14px;
            }
            .card.maga    { border-top-color: #a07030; }
            .card.frp     { border-top-color: #4a7a9e; }
            .card.sd      { border-top-color: #8a7040; }
            .card.rn      { border-top-color: #5078a0; }
            .card.fdi     { border-top-color: #3a8a7a; }
            .card.reform  { border-top-color: #30808e; }
            .card.afd     { border-top-color: #a04a3a; }
            .card.hungary { border-top-color: #a05c20; }
            .card.vox     { border-top-color: #5e8a3a; }
            .card.pis     { border-top-color: #804a48; }
            .card.general { border-top-color: #6a7080; }
            .card.nodes   { border-top-color: #6e52a0; }
            .card.bluesky { border-top-color: #4a7a9e; }
            .card.bluesky .item .desc {
                white-space: pre-wrap;
            }
            @media (min-width: 720px) {
                .card.general {
                    grid-column: span 2;
                }
                .card.general .body {
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 0 20px;
                }
                .card.general .item:nth-child(-n + 2) {
                    border-top: 0;
                    padding-top: 0;
                    margin-top: 0;
                }
                .card.nodes,
                .card.bluesky {
                    grid-column: 1 / -1;
                }
                .card.nodes .body,
                .card.bluesky .body {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 0 20px;
                }
                .card.nodes .item:nth-child(-n + 3),
                .card.bluesky .item:nth-child(-n + 3) {
                    border-top: 0;
                    padding-top: 0;
                    margin-top: 0;
                }
            }
            .head {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 8px;
                margin-bottom: 10px;
            }
            .title {
                font-weight: 700;
                font-size: 15px;
                line-height: 1.25;
            }
            .age {
                color: var(--mute);
                font-size: 12px;
                margin-top: 2px;
            }
            .age.stale {
                color: #a8a29e;
            }
            .item {
                border-top: 1px solid rgba(0, 0, 0, 0.08);
                padding-top: 8px;
                margin-top: 8px;
            }
            .item:first-of-type {
                border-top: 0;
                padding-top: 0;
                margin-top: 0;
            }
            .item a {
                color: inherit;
                text-decoration: none;
                display: block;
            }
            .item h3 {
                margin: 0;
                font-size: 14px;
                font-weight: 600;
                line-height: 1.3;
            }
            .meta {
                color: var(--mute);
                font-size: 12px;
                margin-top: 2px;
            }
            .desc {
                font-size: 12.5px;
                color: #44403c;
                margin-top: 4px;
                line-height: 1.35;
            }
            .err {
                color: #b91c1c;
                background: #fef2f2;
                padding: 8px;
                border-radius: 6px;
                font-size: 12px;
                margin-top: 4px;
            }
            .empty {
                color: var(--mute);
                font-style: italic;
                font-size: 13px;
                padding: 6px 0;
            }
            .foot {
                text-align: center;
                color: var(--mute);
                font-size: 12px;
                margin-top: 20px;
            }
            .spin {
                display: inline-block;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .head { cursor: grab; user-select: none; }
            .head:active { cursor: grabbing; }
            .card-ghost { opacity: 0.35; }
            .card-drag { box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    </head>
    <body>
        <div class="wrap">
            <header>
                <div>
                    <h1>Right-Wing Monitor</h1>
                    <div class="sub">
                        A research-oriented media monitoring tool focused on right-wing and
                        far-right political actors across Europe and the U.S.
                    </div>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0">
                    <button id="translateAll" style="font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 12px;font-weight:700;font-size:12px;letter-spacing:0.3px;color:#57534e;transition:all .15s ease">EN</button>
                    <button id="resetOrder" title="Restore default card order" style="font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 12px">↺ Reset</button>
                    <button class="primary" id="refreshAll">↻ Refresh all</button>
                </div>
            </header>

            <div class="grid" id="grid"></div>
            <div class="foot">
                All links are automatically aggregated via Google News RSS. Errors and irrelevant results may occur.
            </div>
        </div>

        <script>
            // ============================================================
            // rss2json.com API key (free: 10,000 requests/day)
            // Sign up at https://rss2json.com/sign-up to get one.
            //
            // Option A — paste inline (simple, but do NOT commit this file
            // to a public repo afterwards):
            const RSS2JSON_KEY_INLINE = "";
            //
            // Option B — keep the file clean, set once from browser console:
            //   localStorage.setItem("rss2json_key", "YOUR_KEY_HERE")
            // then refresh the page. This survives across sessions.
            // ============================================================
            const RSS2JSON_KEY =
                (typeof localStorage !== "undefined" &&
                    localStorage.getItem("rss2json_key")) ||
                RSS2JSON_KEY_INLINE ||
                "e3xqpmsfkaarzbksh1vd6cz0hatwotgdhk8skm6z";

            const PARTIES = [
                {
                    id: "maga",
                    name: "MAGA/Trump",
                    flag: "🇺🇸",
                    q: '"Donald Trump" OR "Trump administration" OR MAGA OR "JD Vance" OR "Stephen Miller" OR "America First" OR "Steve Bannon"',
                    lang: "en",
                    country: "US",
                },
                {
                    id: "frp",
                    name: "Fremskrittspartiet",
                    flag: "🇳🇴",
                    q: 'Fremskrittspartiet OR FrP OR "Sylvi Listhaug" OR "Norwegian Progress Party" OR "Per-Willy Amundsen" OR "Hans Andreas Limi" OR "Simen Velle"',
                    lang: "no",
                    country: "NO",
                },
                {
                    id: "sd",
                    name: "Sverigedemokraterna",
                    flag: "🇸🇪",
                    q: 'Sverigedemokraterna OR "Jimmie Åkesson" OR "Sweden Democrats"',
                    lang: "sv",
                    country: "SE",
                },
                {
                    id: "rn",
                    name: "Rassemblement National",
                    flag: "🇫🇷",
                    q: '"Rassemblement National" OR "Marine Le Pen" OR "Jordan Bardella" OR "National Rally" OR "Marion Maréchal"',
                    lang: "fr",
                    country: "FR",
                },
                {
                    id: "fdi",
                    name: "Fratelli d'Italia/Lega",
                    flag: "🇮🇹",
                    q: 'Meloni OR Salvini OR "Fratelli d\'Italia" OR "Brothers of Italy" OR Lega',
                    lang: "it",
                    country: "IT",
                },
                {
                    id: "reform",
                    name: "Reform UK",
                    flag: "🇬🇧",
                    q: '"Reform UK" OR "Nigel Farage" OR "Richard Tice"',
                    lang: "en",
                    country: "GB",
                },
                {
                    id: "afd",
                    name: "AfD (Germany)",
                    flag: "🇩🇪",
                    q: '"Alternative fur Deutschland" OR AfD OR "Tino Chrupalla" OR "Alice Weidel"',
                    lang: "de",
                    country: "DE",
                },
                {
                    id: "hungary",
                    name: "Hungary (Fidesz / Tisza)",
                    flag: "🇭🇺",
                    q: '"Orbán Viktor" OR "Magyar Péter" OR "Fidesz" OR "Tisza"',
                    lang: "hu",
                    country: "HU",
                },
                {
                    id: "vox",
                    name: "Vox (Spain)",
                    flag: "🇪🇸",
                    q: '"Vox" OR "Santiago Abascal" OR "Ignacio Garriga" OR "Javier Ortega Smith" OR "Rocío Monasterio" OR "Kiko Méndez-Monasterio"',
                    lang: "es",
                    country: "ES",
                },
                {
                    id: "pis",
                    name: "PiS (Poland)",
                    flag: "🇵🇱",
                    q: '"Prawo i Sprawiedliwość" OR "PiS" OR "Jarosław Kaczyński" OR "Mateusz Morawiecki" OR "Karol Nawrocki" OR "Law and Justice"',
                    lang: "pl",
                    country: "PL",
                },
                {
                    id: "general",
                    name: "General Right-Wing News",
                    flag: "🌍",
                    queries: [
                        '"far right" OR "alt-right" OR "right-wing extremist" OR "fascism"',
                        '"ethnonationalism" OR "white nationalism" OR "Christian nationalism" OR "manosphere"',
                        '"national conservatism" OR "illiberal democracy" OR "techno-fascism"',
                    ],
                    lang: "en",
                    country: "US",
                },
                {
                    id: "bluesky",
                    name: "TrumpNews (Bluesky)",
                    flag: "🦋",
                    type: "bluesky",
                    handle: "victorshammas.com",
                    feedKey: "trump-news",
                },
                {
                    id: "nodes",
                    name: "Transnational Network Infrastructure",
                    flag: "🕸️",
                    queries: [
                        '"Heritage Foundation" OR "Project 2025" OR "American Enterprise Institute" OR "Claremont Institute" OR "Edmund Burke Foundation"',
                        '"Danube Institute" OR "Mathias Corvinus Collegium" OR "MCC Budapest" OR "MCC Brussels"',
                        '"National Conservatism" OR "NatCon" OR "Conservative Political Action Conference" OR "CPAC" OR "Turning Point USA" OR "Turning Point UK"',
                        '"Institute of Economic Affairs" OR "Policy Exchange" OR "Centre for Policy Studies" OR "Alliance for Responsible Citizenship"',
                    ],
                    lang: "en",
                    country: "US",
                },
            ];
            const LS_KEY = "farright_tracker_v1";
            const STALE_MS = 3 * 3600 * 1000;
            const MAX = 8;
            const MAX_GENERAL = 16;
            const MAX_NODES = 9;
            const MAX_BLUESKY = 12;

            const store = {
                get: () => {
                    try {
                        return JSON.parse(localStorage.getItem(LS_KEY)) || {};
                    } catch {
                        return {};
                    }
                },
                set: (v) => {
                    try {
                        localStorage.setItem(LS_KEY, JSON.stringify(v));
                    } catch {}
                },
            };
            let state = store.get();

            const feedUrl = (p, query) => {
                const win = p.window || "5d"; // 5-day limit across the board
                const q = query || p.q;
                const g = `https://news.google.com/rss/search?q=${encodeURIComponent(q + " when:" + win)}&hl=${p.lang}&gl=${p.country}&ceid=${p.country}:${p.lang}&_cb=${Date.now()}`;
                const keyParam = RSS2JSON_KEY
                    ? `&api_key=${encodeURIComponent(RSS2JSON_KEY)}`
                    : "";
                return `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(g)}${keyParam}`;
            };
            const strip = (h, source) => {
                if (!h) return "";
                let t = h
                    .replace(/<[^>]+>/g, " ")
                    .replace(/&nbsp;/g, " ")
                    .replace(/&amp;/g, "&")
                    .replace(/&quot;/g, '"')
                    .replace(/&#39;/g, "'")
                    .replace(/\s+/g, " ")
                    .trim();
                if (source) {
                    const esc = source.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    t = t.replace(new RegExp("[\\s\\-–—]*" + esc + "\\s*$", "i"), "").trim();
                }
                return t.length > 220 ? t.slice(0, 220) + "…" : t;
            };
            const srcOf = (t) => {
                const m = t.match(/\s-\s([^-]+)$/);
                return m ? m[1].trim() : "";
            };
            const fmtD = (iso) =>
                iso
                    ? new Date(iso).toLocaleDateString(undefined, {
                          month: "short",
                          day: "numeric",
                      })
                    : "";
            const age = (ts) => {
                if (!ts) return "never";
                const h = Math.floor((Date.now() - ts) / 3600000);
                if (h < 1) return "just now";
                if (h < 24) return h + "h ago";
                return Math.floor(h / 24) + "d ago";
            };
            const esc = (s) =>
                (s || "").replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );

            async function resolveDid(handle) {
                state.__dids = state.__dids || {};
                if (state.__dids[handle]) return state.__dids[handle];
                const r = await fetch(
                    `https://public.api.bsky.app/xrpc/com.atproto.identity.resolveHandle?handle=${encodeURIComponent(handle)}`,
                );
                const j = await r.json();
                if (!j.did) throw new Error("Could not resolve handle");
                state.__dids[handle] = j.did;
                store.set(state);
                return j.did;
            }

            async function fetchBluesky(p) {
                const did = await resolveDid(p.handle);
                const feedUri = `at://${did}/app.bsky.feed.generator/${p.feedKey}`;
                const url = `https://public.api.bsky.app/xrpc/app.bsky.feed.getFeed?feed=${encodeURIComponent(feedUri)}&limit=${MAX_BLUESKY}`;
                const r = await fetch(url);
                const j = await r.json();
                if (!j.feed) throw new Error(j.message || "feed error");
                return j.feed.slice(0, MAX_BLUESKY).map((entry) => {
                    const post = entry.post;
                    const rkey = post.uri.split("/").pop();
                    const handle = post.author.handle;
                    const text = (post.record?.text || "").trim();
                    const embed = post.embed || post.record?.embed;
                    const ext =
                        embed?.external || embed?.record?.embeds?.[0]?.external || null;
                    const postUrl = `https://bsky.app/profile/${handle}/post/${rkey}`;
                    const title =
                        (ext?.title || "").trim() ||
                        text.split("\n")[0].slice(0, 120) ||
                        "(no text)";
                    const linkUrl = ext?.uri || postUrl;
                    let summary = text;
                    if (!ext?.title && text.split("\n").length > 1) {
                        summary = text.split("\n").slice(1).join("\n").trim();
                    } else if (!ext?.title) {
                        summary = "";
                    }
                    if (summary.length > 300) summary = summary.slice(0, 300) + "…";
                    return {
                        title,
                        url: linkUrl,
                        source: post.author.displayName || `@${handle}`,
                        date: post.record?.createdAt,
                        summary,
                    };
                });
            }

            async function fetchParty(p) {
                const card = document.querySelector(`[data-id="${p.id}"]`);
                const btn = card.querySelector(".rbtn");
                btn.innerHTML = '<span class="spin">↻</span>';
                btn.disabled = true;
                try {
                    let stories;
                    let errors = [];
                    if (p.type === "bluesky") {
                        stories = await fetchBluesky(p);
                    } else {
                        const queries = p.queries || [p.q];
                        const results = await Promise.all(
                            queries.map(async (q) => {
                                try {
                                    const r = await fetch(feedUrl(p, q));
                                    const j = await r.json();
                                    if (j.status !== "ok") {
                                        const msg =
                                            j.message || j.status || "unknown rss2json error";
                                        console.warn(
                                            `[${p.id}] rss2json error for query`,
                                            q,
                                            "→",
                                            j,
                                        );
                                        errors.push(msg);
                                        return [];
                                    }
                                    return j.items || [];
                                } catch (err) {
                                    console.warn(
                                        `[${p.id}] fetch exception for query`,
                                        q,
                                        "→",
                                        err,
                                    );
                                    errors.push(err.message || "fetch failed");
                                    return [];
                                }
                            }),
                        );
                        const merged = [].concat(...results);
                        const seen = new Set();
                        const deduped = merged.filter((it) => {
                            if (!it.link || seen.has(it.link)) return false;
                            seen.add(it.link);
                            return true;
                        });
                        const limit =
                            p.id === "general"
                                ? MAX_GENERAL
                                : p.id === "nodes"
                                  ? MAX_NODES
                                  : MAX;
                        // 5-day hard cutoff locally to match API request
                        const cutoffMs = Date.now() - 5 * 24 * 3600 * 1000; 
                        stories = deduped
                            .filter((it) => {
                                const t = new Date(it.pubDate || 0).getTime();
                                return t && t >= cutoffMs;
                            })
                            .sort(
                                (a, b) => new Date(b.pubDate || 0) - new Date(a.pubDate || 0),
                            )
                            .slice(0, limit)
                            .map((it) => {
                                const source = srcOf(it.title);
                                return {
                                    title: it.title.replace(/\s-\s[^-]+$/, "").trim(),
                                    url: it.link,
                                    source,
                                    date: it.pubDate,
                                    summary: "",
                                };
                            });
                        if (p.id === "general") {
                            stories = stories.slice(0, Math.floor(stories.length / 2) * 2);
                        }
                        if (p.id === "nodes") {
                            stories = stories.slice(0, Math.floor(stories.length / 3) * 3);
                        }
                    }
                    state[p.id] = { stories, fetchedAt: Date.now(), errors };
                    store.set(state);
                    renderCard(p);
                } catch (e) {
                    card.querySelector(".body").innerHTML =
                        `<div class="err">⚠ ${esc(e.message || "Failed")}</div>`;
                    btn.innerHTML = "↻";
                    btn.disabled = false;
                }
            }

            async function translateText(text, sourceLang) {
                if (!text) return "";
                const url =
                    `https://translate.googleapis.com/translate_a/single?client=gtx` +
                    `&sl=${encodeURIComponent(sourceLang || "auto")}&tl=en&dt=t&q=${encodeURIComponent(text)}`;
                const r = await fetch(url);
                if (!r.ok) throw new Error("translate HTTP " + r.status);
                const j = await r.json();
                if (!Array.isArray(j) || !Array.isArray(j[0]))
                    throw new Error("translate parse");
                return j[0].map((chunk) => (chunk && chunk[0]) || "").join("");
            }

            async function translateCard(p) {
                const card = document.querySelector(`[data-id="${p.id}"]`);
                const tbtn = card.querySelector(".tbtn");
                const d = state[p.id];
                if (!d || !d.stories?.length) return;

                if (d.translated) {
                    d.translated = false;
                    store.set(state);
                    renderCard(p);
                    return;
                }

                const allCached = d.stories.every(
                    (s) => s.titleEn !== undefined && s.summaryEn !== undefined,
                );
                if (allCached) {
                    d.translated = true;
                    store.set(state);
                    renderCard(p);
                    return;
                }

                tbtn.innerHTML = '<span class="spin">↻</span>';
                tbtn.disabled = true;

                try {
                    await Promise.all(
                        d.stories.map(async (s) => {
                            if (s.titleEn === undefined) {
                                try {
                                    s.titleEn = await translateText(s.title, p.lang);
                                } catch {
                                    s.titleEn = s.title;
                                }
                            }
                            if (s.summaryEn === undefined) {
                                try {
                                    s.summaryEn = s.summary
                                        ? await translateText(s.summary, p.lang)
                                        : "";
                                } catch {
                                    s.summaryEn = s.summary || "";
                                }
                            }
                        }),
                    );
                    d.translated = true;
                    store.set(state);
                    renderCard(p);
                } catch (e) {
                    tbtn.innerHTML = "EN";
                    tbtn.disabled = false;
                    card.querySelector(".body").insertAdjacentHTML(
                        "afterbegin",
                        `<div class="err">⚠ Translation failed: ${esc(e.message || "unknown")}</div>`,
                    );
                }
            }

            function renderCard(p) {
                const card = document.querySelector(`[data-id="${p.id}"]`);
                const d = state[p.id];
                const stale = !d || Date.now() - d.fetchedAt > STALE_MS;
                card.querySelector(".age").className = "age" + (stale ? " stale" : "");
                card.querySelector(".age").textContent =
                    age(d?.fetchedAt) + (stale && d ? " · stale" : "");
                const body = card.querySelector(".body");
                const btn = card.querySelector(".rbtn");
                btn.innerHTML = "↻";
                btn.disabled = false;
                const tbtn = card.querySelector(".tbtn");
                if (tbtn) {
                    tbtn.innerHTML = "EN";
                    tbtn.disabled = false;
                    tbtn.classList.toggle("active", !!d?.translated);
                    tbtn.title = d?.translated ? "Show original" : "Translate to English";
                }
                if (!d) {
                    body.innerHTML = '<div class="empty">Tap ↻ to load</div>';
                    return;
                }
                const useEn = !!d.translated;
                const errHtml =
                    d.errors && d.errors.length
                        ? `<div class="err">⚠ ${esc(d.errors[0])}${d.errors.length > 1 ? ` (+${d.errors.length - 1} more)` : ""}</div>`
                        : "";
                if (!d.stories || !d.stories.length) {
                    // Updated the fallback text here to reflect the 5-day limit
                    body.innerHTML =
                        errHtml || '<div class="empty">No results in the last 5 days</div>';
                    return;
                }
                body.innerHTML =
                    errHtml +
                    d.stories
                        .map((s) => {
                            const title = useEn && s.titleEn ? s.titleEn : s.title;
                            const summary =
                                useEn && s.summaryEn !== undefined ? s.summaryEn : s.summary;
                            return `
            <div class="item"><a href="${esc(s.url)}" target="_blank" rel="noopener">
              <h3>${esc(title)} ↗</h3>
              <div class="meta">${esc(s.source)}${s.source && s.date ? " · " : ""}${esc(fmtD(s.date))}</div>
              ${summary ? `<div class="desc">${esc(summary)}</div>` : ""}
            </a></div>`;
                        })
                        .join("");
            }

            // ── Drag-to-reorder ──
            // Column span per card id on the 3-col desktop grid; default 1.
            const SPANS = { general: 2, nodes: 3, bluesky: 3 };
            const ORDER_KEY = "farright_tracker_order_v1";
            const loadOrder = () => { try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || null; } catch { return null; } };
            const saveOrderIds = (ids) => { try { localStorage.setItem(ORDER_KEY, JSON.stringify(ids)); } catch {} };
            const clearOrderKey = () => { try { localStorage.removeItem(ORDER_KEY); } catch {} };

            function applySavedOrder() {
                const saved = loadOrder();
                if (!saved || !Array.isArray(saved)) return;
                PARTIES.sort((a, b) => {
                    const ai = saved.indexOf(a.id);
                    const bi = saved.indexOf(b.id);
                    if (ai === -1 && bi === -1) return 0;
                    if (ai === -1) return 1;
                    if (bi === -1) return -1;
                    return ai - bi;
                });
            }

            // A multi-column card must fit in the current row; a 3-col card
            // must start at column 0. Trailing partial rows are OK.
            function isValidLayout(ids) {
                let col = 0;
                for (const id of ids) {
                    const s = SPANS[id] || 1;
                    if (s === 1) {
                        col = (col + 1) % 3;
                    } else if (s === 2) {
                        if (3 - col < 2) return false;
                        col = (col + 2) % 3;
                    } else {
                        if (col !== 0) return false;
                    }
                }
                return true;
            }

            function initSortable() {
                const grid = document.getElementById("grid");
                if (typeof Sortable === "undefined") return;
                Sortable.create(grid, {
                    handle: ".head",
                    filter: ".rbtn, .tbtn",
                    preventOnFilter: false,
                    animation: 150,
                    ghostClass: "card-ghost",
                    dragClass: "card-drag",
                    onMove(evt) {
                        const ids = [...grid.children].map((el) => el.dataset.id);
                        const draggedId = evt.dragged.dataset.id;
                        const relatedId = evt.related.dataset.id;
                        const fromIdx = ids.indexOf(draggedId);
                        let toIdx = ids.indexOf(relatedId);
                        if (evt.willInsertAfter) toIdx++;
                        const proposed = ids.slice();
                        proposed.splice(fromIdx, 1);
                        proposed.splice(toIdx > fromIdx ? toIdx - 1 : toIdx, 0, draggedId);
                        return isValidLayout(proposed);
                    },
                    onEnd() {
                        saveOrderIds([...grid.children].map((el) => el.dataset.id));
                    },
                });
            }

            function render() {
                applySavedOrder();
                document.getElementById("grid").innerHTML = PARTIES.map(
                    (p) => `
            <div class="card ${p.id}" data-id="${p.id}">
              <div class="head">
                <div><div class="title">${p.flag} ${esc(p.name)}</div><div class="age">never</div></div>
                <div class="head-btns">
                  ${p.lang && p.lang !== "en" && !p.type ? '<button class="tbtn" title="Translate to English">EN</button>' : ""}
                  <button class="rbtn">↻</button>
                </div>
              </div>
              <div class="body"><div class="empty">Tap ↻ to load</div></div>
            </div>`,
                ).join("");
                
                // Implemented auto-fetch logic here
                PARTIES.forEach((p) => {
                    document
                        .querySelector(`[data-id="${p.id}"] .rbtn`)
                        .addEventListener("click", () => fetchParty(p));
                    const tbtn = document.querySelector(`[data-id="${p.id}"] .tbtn`);
                    if (tbtn) tbtn.addEventListener("click", () => translateCard(p));
                    
                    if (state[p.id]) {
                        renderCard(p);
                        // Auto-fetch if cached data is older than STALE_MS (3 hours)
                        if (Date.now() - state[p.id].fetchedAt > STALE_MS) {
                            fetchParty(p);
                        }
                    } else {
                        // Auto-fetch immediately if no cache exists
                        fetchParty(p);
                    }
                });
            }
            document.getElementById("translateAll").addEventListener("click", async (e) => {
                const btn = e.target;
                const translatable = PARTIES.filter((p) => p.lang && p.lang !== "en" && !p.type);
                const loaded = translatable.filter((p) => state[p.id]?.stories?.length);
                if (!loaded.length) return;

                const allTranslated = loaded.every((p) => state[p.id]?.translated);

                if (allTranslated) {
                    loaded.forEach((p) => {
                        state[p.id].translated = false;
                    });
                    store.set(state);
                    loaded.forEach((p) => renderCard(p));
                    btn.style.background = "#fff";
                    btn.style.color = "#57534e";
                    btn.style.borderColor = "var(--line)";
                    return;
                }

                btn.innerHTML = '<span class="spin">↻</span>';
                btn.disabled = true;

                const toTranslate = loaded.filter((p) => !state[p.id]?.translated);
                await Promise.all(
                    toTranslate.map(async (p) => {
                        const d = state[p.id];
                        const card = document.querySelector(`[data-id="${p.id}"]`);
                        const tbtn = card?.querySelector(".tbtn");
                        if (tbtn) {
                            tbtn.innerHTML = '<span class="spin">↻</span>';
                            tbtn.disabled = true;
                        }

                        const needsTranslation = d.stories.some(
                            (s) => s.titleEn === undefined || s.summaryEn === undefined,
                        );
                        if (needsTranslation) {
                            await Promise.all(
                                d.stories.map(async (s) => {
                                    if (s.titleEn === undefined) {
                                        try { s.titleEn = await translateText(s.title, p.lang); }
                                        catch { s.titleEn = s.title; }
                                    }
                                    if (s.summaryEn === undefined) {
                                        try { s.summaryEn = s.summary ? await translateText(s.summary, p.lang) : ""; }
                                        catch { s.summaryEn = s.summary || ""; }
                                    }
                                }),
                            );
                        }
                        d.translated = true;
                        renderCard(p);
                    }),
                );

                store.set(state);
                btn.innerHTML = "EN";
                btn.disabled = false;
                btn.style.background = "var(--ink)";
                btn.style.color = "#fff";
                btn.style.borderColor = "var(--ink)";
            });
            document.getElementById("refreshAll").addEventListener("click", async (e) => {
                e.target.disabled = true;
                await Promise.all(PARTIES.map(fetchParty));
                e.target.disabled = false;
            });
            document.getElementById("resetOrder").addEventListener("click", () => {
                clearOrderKey();
                location.reload();
            });
            render();
            initSortable();
        </script>
    </body>
</html>
