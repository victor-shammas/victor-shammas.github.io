# ================================================================
# Sveltia CMS Configuration
# Docs: https://github.com/sveltia/sveltia-cms
# (compatible with Decap/Netlify CMS config format)
# ================================================================

# ── Backend ──────────────────────────────────────────────────────
# Sveltia CMS authenticates directly with GitHub using PKCE.
# No OAuth proxy or Netlify Identity needed — it all happens
# in the browser. Only users with repo write access can log in.
backend:
  name: github
  repo: victor-shammas/victor-shammas.github.io
  branch: main
  base_url: https://sveltia-cms-auth.victor-shammas.workers.dev
  
# ── Media ────────────────────────────────────────────────────────
# Where uploaded images (e.g. blog post feature images) are stored.
media_folder: "static/images/blog"
public_folder: "/images/blog"

# ── Slug settings ────────────────────────────────────────────────
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ── Collections ──────────────────────────────────────────────────

collections:

  # ── Blog Posts ─────────────────────────────────────────────────
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields:
      fields: ["date", "title"]
      default: { field: "date", direction: "descending" }
    summary: "{{title}} — {{date | date('YYYY/MM/DD')}}"
    preview_path: "blog/{{slug}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The headline of your blog post."

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: true
        hint: "Set to false when ready to publish."

      - label: "Deck / Subtitle"
        name: "dek"
        widget: "string"
        required: false
        hint: "A one-line summary shown below the title in italics."

      - label: "Feature Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Optional cover image for the post."

      - label: "Summary"
        name: "summary"
        widget: "text"
        required: false
        hint: "Short excerpt shown on the blog listing page. If empty, Hugo auto-generates one."

      - label: "Theory Brief original"
        name: "original"
        widget: "string"
        required: false
        hint: "Optional. Posts link to The Theory Brief post with the same title automatically; paste its URL here only if the titles differ."

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "The full post content. Supports Markdown, images, links, and HTML."

  # ── Static Pages ───────────────────────────────────────────────
  # These let you edit the About, Contact, Tools, Media, and Norwegian
  # pages via the CMS GUI. The Research page uses raw HTML for its
  # complex bibliography formatting, so it's edited in the repo.
  #
  # NOTE: `hidden` fields below carry structural front matter (layout,
  # url, menu, aliases, etc.) so they round-trip untouched on save —
  # the CMS only writes fields it knows about, so anything not declared
  # here would be dropped. Bodies that are mostly raw HTML use the
  # `text` widget (a plain textarea) so the markdown editor can't
  # reformat the markup; prose-heavy bodies use `markdown`.

  - name: "pages"
    label: "Pages"
    files:

      - label: "About"
        name: "about"
        file: "content/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Aliases", name: "aliases", widget: "hidden" }
          - { label: "Body", name: "body", widget: "text" }

      - label: "Contact"
        name: "contact"
        file: "content/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string", required: false }
          - { label: "Menu", name: "menu", widget: "hidden" }
          - { label: "Body", name: "body", widget: "text" }

      - label: "Tools"
        name: "tools"
        file: "content/tools/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Layout", name: "layout", widget: "hidden" }
          - { label: "URL", name: "url", widget: "hidden" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Media"
        name: "media"
        file: "content/media.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Layout", name: "layout", widget: "hidden" }
          - { label: "Type", name: "type", widget: "hidden" }
          - { label: "Aliases", name: "aliases", widget: "hidden" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Norwegian"
        name: "norwegian"
        file: "content/norwegian.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
          - { label: "Language", name: "lang", widget: "hidden" }
          - { label: "Layout", name: "layout", widget: "hidden" }
          - { label: "URL", name: "url", widget: "hidden" }
          - { label: "Aliases", name: "aliases", widget: "hidden" }
          - { label: "Body", name: "body", widget: "markdown" }

  # ── News ───────────────────────────────────────────────────────
  # One-line updates shown on the About page (latest 5) and at /news/.
  # The data file is a single object with an `items` list; new items
  # are added at the top. The site sorts by date regardless, and the
  # sort-news workflow reorders the file newest-first after every save
  # so this list matches (reload the admin to see the new order).
  - name: "news"
    label: "News"
    files:
      - label: "News items"
        name: "news"
        file: "data/news.yaml"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            add_to_top: true
            collapsed: auto
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - label: "Date"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "YYYY-MM-DD"
                time_format: false
                hint: "Shown as day, month, year (e.g. 18 September 2026)."
              - label: "Headline"
                name: "title"
                widget: "string"
                hint: "Short, e.g. “PhD defense, Stockholm University”."
              - label: "Explanation"
                name: "text"
                widget: "text"
                required: false
                hint: "Optional single sentence. Tenseless phrasing (“Member of…”, “Keynote at…”) never needs updating. Markdown links allowed."
              - label: "Link"
                name: "link"
                widget: "string"
                required: false
                hint: "Optional URL; makes the headline a link."

# ── Singletons ───────────────────────────────────────────────────
# Single files that open straight into the editor from the sidebar
# (listed under "Files", below the collections), with no intermediate
# list page to click through.
singletons:
  # ── Reading ────────────────────────────────────────────────────
  # The running link log at /reading/. Same shape as News: one data
  # file with an `items` list, new items added at the top. The page
  # sorts by date and groups by month, so file order doesn't matter.
  # A blank title is filled in from the page by the fill-reading-titles
  # workflow a minute or two after saving (reload the admin to see it).
  # It only ever fills blanks, so typed or edited titles always win.
  # Imported links don't land here directly: see "Reading queue" below.
  - label: "Reading"
    name: "reading"
    file: "data/reading.yaml"
    fields:
      - label: "Items"
        name: "items"
        widget: "list"
        add_to_top: true
        collapsed: auto
        summary: "{{fields.date}} — {{fields.title}}"
        fields:
          - label: "Date"
            name: "date"
            widget: "datetime"
            format: "YYYY-MM-DD"
            date_format: "YYYY-MM-DD"
            time_format: false
            default: "{{now}}"
            hint: "When you read it. Defaults to today."
          - label: "Link"
            name: "link"
            widget: "string"
            pattern: ["^https?://", "Must start with http:// or https://"]
            hint: "Full URL. The site shows its domain next to the title."
          - label: "Title"
            name: "title"
            widget: "string"
            required: false
            hint: "Leave blank to fill it in from the page automatically (a minute or two after saving; reload to see it). A title typed or edited here is never overwritten. Clear it to re-fetch."
          - label: "Note"
            name: "note"
            widget: "text"
            required: false
            hint: "Optional commentary, shown under the title. Markdown allowed."

  # ── Reading queue ──────────────────────────────────────────────
  # Links from my Bluesky posts and Substack Notes, imported hourly by
  # the import-reading-links workflow, wait here; the site doesn't show
  # them. Edit an item, tick "Publish" and save: the fill-reading-titles
  # workflow then moves it to Reading (a minute or two later; reload the
  # admin to see it). Deleting an item discards it for good. Items can
  # also be added by hand, to finish and publish later.
  - label: "Reading queue"
    name: "reading-queue"
    file: "data/reading-queue.yaml"
    fields:
      - label: "Items"
        name: "items"
        widget: "list"
        add_to_top: true
        collapsed: auto
        summary: "{{fields.date}} — {{fields.title}}"
        fields:
          - label: "Date"
            name: "date"
            widget: "datetime"
            format: "YYYY-MM-DD"
            date_format: "YYYY-MM-DD"
            time_format: false
            default: "{{now}}"
            hint: "When you posted it. Change it if you like; it's the date shown in Reading."
          - label: "Link"
            name: "link"
            widget: "string"
            pattern: ["^https?://", "Must start with http:// or https://"]
          - label: "Title"
            name: "title"
            widget: "string"
            required: false
            hint: "Leave blank to fill it in from the page automatically (reload to see it). A title typed or edited here is never overwritten."
          - label: "Note"
            name: "note"
            widget: "text"
            required: false
            hint: "Starts as your post's text, minus the link. Edit it for the log: it's shown under the title once published. Markdown allowed."
          - label: "Source"
            name: "source"
            widget: "string"
            required: false
            hint: "Where it was imported from. Not shown on the site."
          - label: "Publish"
            name: "publish"
            widget: "boolean"
            default: false
            hint: "Tick and save to move this to Reading (a minute or two later; reload to see it). To discard it instead, delete the item."
