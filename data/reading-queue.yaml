  - date: 2026-11-11
    link: "https://www.politico.com/news/2026/11/10/musk-data-center-spacex-hometown-01157834"
    title: "Musk seeking tax breaks for $24B data center in SpaceX's hometown"
    note: "Municipal state capture: SpaceX executives voting on a SpaceX proposal.\n\n“The three-person city commission — two members of which are also SpaceX executives — will consider the company’s proposal at a Dec. 9 hearing.”"
    source: "Bluesky"
