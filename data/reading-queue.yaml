    title: "Hegseth and staff reprimanded by guard at Tomb of the Unknown Soldier"
    note: "“A soldier guarding the Tomb of the Unknown Soldier reprimanded Defense Secretary Pete Hegseth and his staff for breaking decorum after a Veterans Day ceremony at Arlington National Cemetery.”"
