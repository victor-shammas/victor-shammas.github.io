  - date: 2026-11-15
    link: "https://www.derstandard.at/story/3000000347232/oesterreichischer-geschichtsprofessor-beklagt-in-blog-propaganda-maschinerie-zu-gedenken-nach-1945"
    title: "Österreichischer Geschichtsprofessor beklagt in Blog \"Propaganda-Maschinerie\" zu Gedenken nach 1945"
    note: "A professor of history at the University of Bergen (UiB) in Norway, Stephan Sander-Faes, has posted comments on his pseudonymous Substack denying that the Nazis operated extermination camps, as reported by the Austrian newspaper Der Standard and the Norwegian higher-education outlet Khrono.\n\nIn a comment under one of his own posts from September, Sander-Faes, writing under the moniker “epimetheus,” claims, contrary to all historical evidence, that “there were no dedicated ‘annihilation’ or ‘death camps’” during the Holocaust, and refers to them as “so-called ‘extermination camps.’” In another comment thread from February, a reader writes that “the 6 million Jewish victim of holocaust [sic] are also exaggerated and should be revised down accordingly,” to which Sander-Faes replies: “Exactly.” Sander-Faes appears to have deleted both posts earlier today, along with their comment threads.\n\nAs a UiB faculty member, I was glad to see two of my colleagues, Ines Prodöhl and Yngve Flo, publish a forceful rebuttal of his statements, in which they note that “any expression that minimizes or trivializes the Holocaust is incompatible with the most fundamental scholarly and ethical standards of the historical profession.”\n\nResponding to Sander-Faes’s claims that his remarks were taken out of context and that he was publishing in a private capacity, they point out that “it is not possible to maintain any meaningful distinction between what a history professor publicly states on this subject as a private individual and what they are expected to uphold as a scholar and representative of the academic community and institution of which they are a part.”\n\nUiB’s rector, Margareth Hagen, first cited employees’ “freedom of expression” and declined to comment on the case. Later, Hagen affirmed that “the Holocaust is a historical fact” and that the university rejects “any form of antisemitism, including relativization of the Holocaust.”\n\nNo trivialization or denial of the Holocaust should go unanswered.\n\nSources:\n\nDer Standard:\n\nKhrono:\n\nProdöhl & Flo:\n\nHagen (later statement)"
    source: "Substack Note"
    publish: false
