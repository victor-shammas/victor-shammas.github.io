    title: "EXCLUSIVE: Bloomberg, trading firms to pay Trump for faster Truth Social access, sources say"
    note: "Paying for a 50ms head start on Trump’s Truths: “Truth Social…has signed up news and data provider Bloomberg and two Wall Street firms for faster access to the president’s posts, which it sells for up to $100,000 a month, according to people with direct knowledge of the matter.” (Reuters, Oct. 29)"
