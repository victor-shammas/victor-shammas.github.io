    link: https://www.rawstory.com/elon-musk-election-loss/
    title: 'Elon Musk’s ‘very bad day’ erased more than the fortune he shoveled into MAGA: economist'
    note: The midterms wiped "somewhere between $50 billion and $70 billion off Musk's personal fortune. Those losses dwarf the $474 million the billionaire spent backing Republicans in the midterms, more than any single donor has ever put into one cycle." (Paper losses are subject to change, of course.)
    source: Bluesky
