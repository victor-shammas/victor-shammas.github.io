  - date: 2026-11-10
    link: "https://www.nytimes.com/2026/11/08/us/politics/rubio-nvidia-ceo-chinese-spy.html?unlocked_article_code=1.PVE.U94Z.8_G5_Khw-SNX&smid=nytcore-ios-share"
    title: "Rubio Warned Officials About Nvidia Chief’s Entanglement With Chinese Spy (Gift Article)"
    note: "Marco Rubio may be the real winner in the Jensen Huang scandal: this spring, he oversaw the drafting of a secret memo warning that the Nvidia CEO was having an affair with a suspected Chinese spy; Trump apparently ignored it. (Nvidia had pledged $25 million toward Trump’s ballroom.)\n\nNow that the scandal has exploded in the media, and Rubio’s role has conveniently surfaced, he can claim that he kept his hands clean and even warned his own president, only to be dismissed.\n\nAs Rubio and Vance vie for the 2028 nomination, with Trump near record lows in popularity, anything that can put daylight between Rubio and Trump, without the appearance of disloyalty, will no doubt be welcome."
    source: "Substack Note"
    publish: false
  - date: 2026-11-06
    link: https://www.rawstory.com/elon-musk-election-loss/
    title: 'Elon Musk’s ‘very bad day’ erased more than the fortune he shoveled into MAGA: economist'
    note: The midterms wiped "somewhere between $50 billion and $70 billion off Musk's personal fortune. Those losses dwarf the $474 million the billionaire spent backing Republicans in the midterms, more than any single donor has ever put into one cycle." (Paper losses are subject to change, of course.)
    source: Bluesky
    publish: false
  - date: 2026-11-06
    link: https://www.politico.eu/article/from-madrid-to-maga-how-spains-vox-forged-a-right-wing-network-with-global-reach/
    title: 'From Madrid to MAGA: How Spain’s Vox forged a right-wing network with global reach'
    note: 'Spain’s Vox as the far right’s new post-Orbán bridge: via its Disenso Foundation, Vox “has established ties with Latin American leaders such as Argentina’s Javier Milei and Chile’s José Antonio Kast, while forging relationships with influential figures in the MAGA movement in Washington.”'
    source: Bluesky
    publish: false
  - date: 2026-11-03
    link: https://youtu.be/RVVfJVj5z8s
    title: 'Amazon Empire: The Rise and Reign of Jeff Bezos (full documentary) | FRONTLINE'
    note: '“We’re not treated as human beings. We’re not even treated as robots. We’re treated as part of the data stream.” —Former Amazon warehouse worker, in Amazon Empire: The Rise and Reign of Jeff Bezos (PBS Frontline, 2020)'
    source: Bluesky
