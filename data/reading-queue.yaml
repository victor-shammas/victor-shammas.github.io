    title: Inside Donald Trump Jr’s Mongolian hunting trip with a Kremlin-linked oligarch
    note: '“The auction winners were not Trump Jr’s only companions in the Mongolian wilderness this summer. He also spent two days with Umar Kremlev, a businessman with a criminal record who has close ties to Russian President Vladimir Putin’s personal security service.” #Trump #Putin #oligarchs'
    source: Bluesky
