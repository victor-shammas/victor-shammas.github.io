    title: Opinion | Elon Musk’s Endgame (Gift Article)
    note: |-
      Quinn Slobodian on Musk’s vulnerabilities: “If you pick up the SpaceX prospectus and read through the risk factors, the No. 1 risk factor is national legislation. These are the things that actually keep Musk up at night […]. So that’s something to bear in mind, too: his impression of invulnerability is actually part of his political project.”

      Even trillionaires fear public opinion and, with it, the prospect of laws that might limit their field of action.
    source: Substack Note
    publish: false
  - date: 2026-10-31
    link: https://fullfact.org/ai-benchmark/report-one/
    title: Wrong on Sunday, right on Monday. Why AI chatbots have a confidence problem
    note: |-
      One of the biggest problems with the AI rollout of the past few years has been its largely unregulated, Wild-West nature. Despite technical advances, hallucinations are still a concern.

      Should regulators demand a minimum accuracy threshold for models released to the public? Or at least require independent, systematic auditing of accuracy? That raises the issue of who gets to decide what counts as factual, but the alternative is letting Silicon Valley police itself, with dubious results.

      Here’s a fact-checking report that points in the right direction.
    source: Substack Note
    publish: true
