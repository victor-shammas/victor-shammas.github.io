    title: "Microsoft to Offer Buyouts to 60,000 Workers in Latest Cost Cut"
    note: "Corporations think AI will allow them to keep growing their revenue while downsizing their workforce. That may work in the near term and at the level of the individual firm, but it’s hardly going to play out that way at the aggregate level and in the long run. If millions of jobs are automated away, who’s going to buy the goods and services?\n\n(Microsoft just announced they’re offering buyouts to 60,000 workers.)"
    source: "Substack Note"
