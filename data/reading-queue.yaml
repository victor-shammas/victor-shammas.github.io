  - date: 2026-11-01
    link: https://www.historicalmaterialism.org/political-capitalism-in-perspective-an-interview-with-dylan-riley/
    title: 'Political Capitalism in Perspective: An Interview with Dylan Riley'
    note: |-
      This interview with Dylan Riley of UC Berkeley offers a good entry point to the literature on political capitalism, as an alternative theorization of present-day capitalism to the technofeudalism thesis, and a corrective supplement to the notion of neoliberalism.

      Also some salient comments re the political economy of Trumpism: “I definitely interpret Trump as the apotheosis of political capitalism. It’s the whole thing taken to this unbelievable extreme. It’s almost too easy; I’m almost reluctant to say this, but how do you theorise this? The thing about Trump II is that you can’t theorise it just as a political phenomenon because it’s also a giant system of plunder. It’s quite different in that respect from Trump I. Many of his actions are essentially undertaken just to squeeze, extort, and extract.”
    source: Substack Note
    publish: false
  - date: 2026-10-31
    link: https://www.nytimes.com/2026/10/30/opinion/ezra-klein-podcast-quinn-slobodian.html?unlocked_article_code=1.M1E.3BcF.G0vnLsOuW_KA&smid=nytcore-ios-share
    title: Opinion | Elon Musk’s Endgame
    note: |-
      Quinn Slobodian on Musk’s vulnerabilities: “If you pick up the SpaceX prospectus and read through the risk factors, the No. 1 risk factor is national legislation. These are the things that actually keep Musk up at night […]. So that’s something to bear in mind, too: his impression of invulnerability is actually part of his political project.”

      Even trillionaires fear public opinion and the prospect of laws that might limit their scope of action.
    source: Substack Note
    publish: false
