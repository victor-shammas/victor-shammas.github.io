  - date: 2026-11-10
    link: https://www.nytimes.com/2026/11/08/us/politics/rubio-nvidia-ceo-chinese-spy.html?unlocked_article_code=1.PVE.U94Z.8_G5_Khw-SNX&smid=nytcore-ios-share
    title: Rubio Warned Officials About Nvidia Chief’s Entanglement With Chinese Spy (Gift Article)
    note: |-
      Marco Rubio may be the real winner in the Jensen Huang scandal: this spring, he oversaw the drafting of a secret memo warning that the Nvidia CEO was having an affair with a suspected Chinese spy; Trump apparently ignored it. (Nvidia had pledged $25 million toward Trump’s ballroom.)

      Now that the scandal has exploded in the media, and Rubio’s role has conveniently surfaced, he can claim that he kept his hands clean and even warned his own president, only to be dismissed.

      As Rubio and Vance vie for the 2028 nomination, with Trump near record lows in popularity, anything that can put daylight between Rubio and Trump, without the appearance of disloyalty, will no doubt be welcome.
    source: Substack Note
