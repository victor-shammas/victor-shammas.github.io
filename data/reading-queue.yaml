    title: "Musk’s bet of the century"
    note: "This week, Elon Musk confirmed that Tesla and SpaceX are exploring a merger, which would combine “most of his business interests into what amounts to a single publicly traded Musk Inc.”\n\nThis potential conglomerate could grant the world’s richest man even greater powers, including majority voting control over Tesla, where he now holds only about a fifth of the shares."
