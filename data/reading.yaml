items:
  - date: 2026-11-26
    link: https://www.middleeasteye.net/news/uae-lana-nusseibeh-says-she-doesnt-work-uae
    title: UAE's Lana Nusseibeh says she doesn't work for the UAE
    note: One would expect someone hoping to become next UN Secretary-General to be willing to comment on whether the UAE has helped arm Sudan's RSF; instead, Nusseibeh refers "all questions about what the UAE or others have done to the UAE government" (while promising to "call out all governments").
  - date: 2026-11-26
    link: https://www.npr.org/2026/11/26/g-s1-155940/fcc-spacex-satellites-data-centers-in-space
    title: FCC says SpaceX can deploy 1 million satellites for data centers in space. Scientists are skeptical
    note: Astrophysicist Adam Becker says launching a million data-center satellites into space is "a fantasy." As NPR points out, space is a vacuum, "trapping heat inside objects much like a thermos. Becker explained that there are 'basic physical limits' to otherwise radiating that heat out."
  - date: 2026-11-25
    link: https://www.icij.org/news/2026/11/new-study-shows-proposed-un-tax-convention-could-see-countries-recover-nearly-400-billion-in-taxes/
    title: New study shows proposed UN tax convention could see countries recover nearly $400 billion in taxes
    note: 'Interesting proposal: “The UK and EU each stand to gain over $40 billion and $90 billion per year, respectively, under a proposed UN tax convention…Even on the business side, the convention could be good news for all the small and medium enterprises that are not able to use international loopholes to dodge taxes, but instead have to compete on an unlevel playing field with multinational corporations that are based in tax havens.”'
  - date: 2026-11-25
    link: https://techcrunch.com/2026/11/18/microsoft-ceo-satya-nadella-explains-why-he-asked-60k-employees-to-quit/
    title: Microsoft CEO Satya Nadella explains why he asked 60K employees to quit
    note: 'One of the standout claims made by Microsoft CEO Satya Nadella at DealBook last week was that Cowork, the AI agent inside Microsoft 365 available to tens of millions of users, is being built by a team of eleven software developers. This is why the tech stack and its assorted ideologies will never become the Fordism of the twenty-first century: there are simply not enough jobs around for them to become the new social compact between capital and labor.'
  - date: 2026-11-24
    link: https://giftarticle.ft.com/giftarticle/actions/redeem/c19e68a2-8fb9-4a5b-9be5-358032741b1d
    title: Inside the ‘war room’ that lobbied Donald Trump to bring back Nvidia’s Jensen Huang
    note: 'Good behind-the-scenes account, with plausible political analysis: “Vance, a former venture capitalist who was mentored by Peter Thiel and has raised millions of dollars from Silicon Valley, was seemingly persuaded by the entreaties of Huang and his allies, who are probably a crucial source of funding if Vance decides to run for president.”'
  - date: 2026-11-11
    link: https://www.politico.com/news/2026/11/10/musk-data-center-spacex-hometown-01157834
    title: Musk seeking tax breaks for $24B data center in SpaceX's hometown
    note: 'We might call this municipal state capture, when SpaceX executives get to vote on a SpaceX proposal: “The three-person city commission — two members of which are also SpaceX executives — will consider the company’s proposal at a Dec. 9 hearing.”'
  - date: 2026-11-01
    link: https://www.historicalmaterialism.org/political-capitalism-in-perspective-an-interview-with-dylan-riley/
    title: 'Political Capitalism in Perspective: An Interview with Dylan Riley'
    note: This interview with Dylan Riley (UC Berkeley) offers a good entry point to the literature on political capitalism, as an alternative theorization of present-day capitalism to the technofeudalism thesis, and a corrective supplement to the notion of neoliberalism.
  - date: 2026-11-05
    link: https://www.nytimes.com/2026/11/05/us/california-death-row-newsom-commutation.html?unlocked_article_code=1.OFE.WtUZ.4E0apIeuGYYu&smid=nytcore-ios-share
    title: Newsom Commutes the Sentences of California’s 548 Death Row Inmates
    note: Newsom's commutation was an unexpected move. "California has more death row inmates than any other state, and Mr. Newsom’s action cancels approximately one-fourth of all death sentences nationwide.”
  - date: 2026-10-31
    link: https://fullfact.org/ai-benchmark/report-one/
    title: Wrong on Sunday, right on Monday. Why AI chatbots have a confidence problem
    note: |-
      One of the biggest problems with the AI rollout of the past few years has been its largely unregulated, Wild-West nature. Despite technical advances, hallucinations are still a concern.

      Should regulators demand a minimum accuracy threshold for models released to the public? Or at least require independent, systematic auditing of accuracy? That raises the issue of who gets to decide what counts as factual, but the alternative is letting Silicon Valley police itself, with dubious results.

      Here’s a fact-checking report that points in the right direction.
  - date: 2026-10-26
    link: https://www.bloomberg.com/news/articles/2026-10-26/microsoft-to-offer-buyouts-to-60-000-workers-in-latest-cost-cut?accessToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzb3VyY2UiOiJTdWJzY3JpYmVyR2lmdGVkQXJ0aWNsZSIsImlhdCI6MTc5MzAzMTcwOSwiZXhwIjoxNzkzNjM2NTA5LCJhcnRpY2xlSWQiOiJUTklLUk9UOTZPU00wMCIsImJjb25uZWN0SWQiOiJCOTFDOTAxQkI4MTk0NTA4OEM3NDA1RTk3N0FCRDE2NSJ9.KOHEPHWtJHRvnPnIitGOzyhWXwfY8-nVjbyaEV-KxOE
    title: Microsoft to Offer Buyouts to 60,000 Workers in Latest Cost Cut
    note: Corporations think AI will allow them to keep growing their revenue while downsizing their workforce. That may work in the near term and at the level of the individual firm, but it’s hardly going to play out that way at the aggregate level and in the long run. If millions of jobs are automated away, who’s going to buy the goods and services? (Microsoft just announced they’re offering buyouts to 60,000 workers.)
  - date: 2026-10-25
    link: https://economist.com/business/2026/10/18/the-ai-industrys-gigantic-debts-are-making-investors-nervous
    title: The AI industry’s gigantic debts are making investors nervous
    note: In every boom there are externalities, some of which will undoubtedly be highly negative and left to be picked up by ordinary people—the asymmetric socialization of costs amid the privatization of gains from the AI gold rush.
  - date: 2026-10-24
    link: https://www.apollo.com/wealth/insights-news/insights/daily-spark/no-signs-of-ai-payoff-outside-the-tech-sector?utm_source=substack&utm_medium=email
    title: No Signs of AI Payoff Outside the Tech Sector | The Daily Spark
    note: Apollo's Torsten Slok argues that the massive AI buildout hasn't brought any measurable gains to non-tech sectors in the U.S. "The AI story will be decided in the S&P 493, not the Mag 7, and so far, there is no evidence that revenue growth or margins are improving outside the tech sector," Slok writes.
  - date: 2026-10-24
    link: https://www.ft.com/content/dfe64d5e-f5f3-444f-a233-a516483fa6f0
    title: Musk’s bet of the century
    note: This week, Elon Musk confirmed that Tesla and SpaceX are exploring a merger, which would combine “most of his business interests into what amounts to a single publicly traded Musk Inc.” This potential conglomerate could grant the world’s richest man even greater powers, including majority voting control over Tesla, where he now holds only about a fifth of the shares.
  - date: 2026-10-24
    link: https://academic.oup.com/ser/advance-article-abstract/doi/10.1093/ser/mwag045/8885840
    title: Living off assets? European household incomes in the ‘asset economy’
    note: An empirical assessment of the "petit-rentier" class in the "asset economy" across 23 European countries. Perhaps unsurprisingly, "the ‘asset economy’ appears to consolidate trajectories of income concentration rather than democratisation."
  - date: 2026-10-24
    link: https://techcrunch.com/2026/10/22/ben-lamm-raises-200m-for-warhound-to-engineer-war-dogs-and-arm-them-with-anduril-gear/
    title: Warhound raises $200M to engineer war dogs and arm them with Anduril gear
    note: 'The tech right’s dreams are truly the stuff of nightmares: Warhound “combines advanced cloning and genetic engineering to develop the next generation of working dogs for military use. The dogs will then get high-tech hardware developed by Anduril.”'
