    title: Microsoft to Offer Buyouts to 60,000 Workers in Latest Cost Cut
    note: Corporations think AI will allow them to keep growing their revenue while downsizing their workforce. That may work in the near term and at the level of the individual firm, but it’s hardly going to play out that way at the aggregate level and in the long run. If millions of jobs are automated away, who’s going to buy the goods and services? (Microsoft just announced they’re offering buyouts to 60,000 workers.)
  - date: 2026-10-25
    link: https://economist.com/business/2026/10/18/the-ai-industrys-gigantic-debts-are-making-investors-nervous
    title: The AI industry’s gigantic debts are making investors nervous
    note: In every boom there are externalities, some of which will undoubtedly be highly negative and left to be picked up by ordinary people—the asymmetric socialization of costs amid the privatization of gains from the AI gold rush.
  - date: 2026-10-24
    link: https://www.apollo.com/wealth/insights-news/insights/daily-spark/no-signs-of-ai-payoff-outside-the-tech-sector?utm_source=substack&utm_medium=email
    title: No Signs of AI Payoff Outside the Tech Sector | The Daily Spark
    note: Apollo's Torsten Slok argues that the massive AI buildout hasn't brought any measurable gains to non-tech sectors in the U.S. "The AI story will be decided in the S&P 493, not the Mag 7, and so far, there is no evidence that revenue growth or margins are improving outside the tech sector," Slok writes.
  - date: 2026-10-24
    link: https://www.ft.com/content/dfe64d5e-f5f3-444f-a233-a516483fa6f0
    title: Musk’s bet of the century
    note: This week, Elon Musk confirmed that Tesla and SpaceX are exploring a merger, which would combine “most of his business interests into what amounts to a single publicly traded Musk Inc.” This potential conglomerate could grant the world’s richest man even greater powers, including majority voting control over Tesla, where he now holds only about a fifth of the shares.
  - date: 2026-10-24
    link: https://academic.oup.com/ser/advance-article-abstract/doi/10.1093/ser/mwag045/8885840
    title: Living off assets? European household incomes in the ‘asset economy’
    note: An empirical assessment of the "petit-rentier" class in the "asset economy" across 23 European countries. Perhaps unsurprisingly, "the ‘asset economy’ appears to consolidate trajectories of income concentration rather than democratisation."
  - date: 2026-10-24
    link: https://techcrunch.com/2026/10/22/ben-lamm-raises-200m-for-warhound-to-engineer-war-dogs-and-arm-them-with-anduril-gear/
    title: Warhound raises $200M to engineer war dogs and arm them with Anduril gear
    note: 'The tech right’s dreams are truly the stuff of nightmares: Warhound “combines advanced cloning and genetic engineering to develop the next generation of working dogs for military use. The dogs will then get high-tech hardware developed by Anduril.”'
