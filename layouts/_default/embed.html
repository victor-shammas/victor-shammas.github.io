{{ define "main" }}
{{ $monitorPaths := slice "/tools/ai-monitor/" "/tools/space-monitor/" "/tools/rightwing-monitor/" }}
{{ $isMonitor := in $monitorPaths .RelPermalink }}
{{ if $isMonitor }}
<div class="tool-shell">
  <nav class="tool-tabs" aria-label="Monitor tabs">
    <a href="/tools/ai-monitor/" class="tool-tab{{ if eq .RelPermalink "/tools/ai-monitor/" }} active{{ end }}">AI Monitor</a>
    <a href="/tools/space-monitor/" class="tool-tab{{ if eq .RelPermalink "/tools/space-monitor/" }} active{{ end }}">Space Monitor</a>
    <a href="/tools/rightwing-monitor/" class="tool-tab{{ if eq .RelPermalink "/tools/rightwing-monitor/" }} active{{ end }}">Right-Wing Politics Monitor</a>
  </nav>
  <iframe
    class="tool-embed"
    src="{{ .Params.embed_src }}"
    title="{{ .Title }}"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
{{ else }}
<iframe
  class="tool-embed"
  src="{{ .Params.embed_src }}"
  title="{{ .Title }}"
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade"></iframe>
{{ end }}
{{ end }}
