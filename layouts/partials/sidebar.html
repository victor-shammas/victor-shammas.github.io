<aside class="sidebar" id="sidebar">
  <a href="/" class="sidebar__name">Victor Shammas</a>
  <div class="sidebar__title">Sociologist</div>

  <ul class="sidebar__nav">
    {{- range .Site.Menus.main -}}
      <li>
        <a href="{{ .URL }}"
           {{- if .Params.external }} class="external" target="_blank" rel="noopener"
           {{- else if eq $.RelPermalink .URL }} class="active"
           {{- else if and (ne .URL "/") (hasPrefix $.RelPermalink .URL) }} class="active"
           {{- end -}}>
          {{ .Name }}
        </a>
      </li>
    {{- end -}}
  </ul>
  
  <div class="sidebar__footer">
    <button class="sidebar__search" id="search-open" type="button" aria-label="Search the site">
      <svg class="sidebar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="sidebar__search-label">Search</span>
      <kbd class="sidebar__search-kbd">/</kbd>
    </button>
    <div>Dept. of Sociology &amp; Social Work<br>University of Agder, Norway</div>
    <div class="sidebar__links">
      <a href="{{ .Site.Params.social.googleScholar }}" target="_blank">Google Scholar</a>
      <a href="{{ .Site.Params.social.academia }}" target="_blank">Academia</a>
      <a href="{{ .Site.Params.social.researchGate }}" target="_blank">ResearchGate</a>
      <a href="{{ .Site.Params.social.linkedIn }}" target="_blank">LinkedIn</a>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="theme-toggle__icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-toggle__icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span class="theme-toggle__label"></span>
    </button>
  </div>

  <div class="sidebar__resizer" id="sidebar-resizer" title="Drag to resize sidebar"></div>
</aside>
